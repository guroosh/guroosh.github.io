<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Résumé — Guroosh Singh</title>
  <link rel="stylesheet" href="assets/output.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --black:#080c08; --green:#00ff41; --green-dim:#00cc33; --green-dark:#0a2e12; --grey:#3a3a3a; --grey-light:#555; --white:#e8e8e8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--black); color:var(--green-dim); font-family:'Share Tech Mono',monospace; min-height:100vh; overflow-x:hidden; }
    #matrix-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.15; pointer-events:none; }
    nav, main, footer { position:relative; z-index:10; }
    body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px); pointer-events:none; z-index:999; }
    nav { border-bottom:1px solid var(--green-dark); padding:1.1rem 3rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; background:rgba(8,12,8,0.95); backdrop-filter:blur(6px); }
    .nav-logo { font-size:0.95rem; color:var(--green); text-decoration:none; letter-spacing:0.08em; }
    .nav-links { display:flex; gap:2.5rem; align-items:center; }
    .nav-links a { font-size:0.7rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--grey-light); text-decoration:none; transition:color 0.2s; }
    .nav-links a:hover { color:var(--green); }
    .nav-links a.active { color:var(--green-dim); }
    .nav-cta { font-size:0.68rem; letter-spacing:0.15em; text-transform:uppercase; border:1px solid var(--green); color:var(--green); padding:0.4rem 1.1rem; text-decoration:none; transition:background 0.2s,color 0.2s; }
    .nav-cta:hover { background:var(--green); color:var(--black); }
    h1 { font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; color:var(--white); line-height:0.95; letter-spacing:0.02em; }
    .section-label { font-size:0.65rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--green); margin-bottom:0.6rem; }
    .rule { border:none; border-top:1px solid var(--green-dark); }
    .fade-in { animation:fadeIn 0.9s ease forwards; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    .btn { font-family:'Share Tech Mono',monospace; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; border:1px solid var(--green); color:var(--green); padding:0.6rem 1.4rem; text-decoration:none; display:inline-block; transition:background 0.2s,color 0.2s; }
    .btn:hover { background:var(--green); color:var(--black); }
    .btn-ghost { font-family:'Share Tech Mono',monospace; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; border:1px solid var(--grey); color:var(--grey-light); padding:0.6rem 1.4rem; text-decoration:none; display:inline-block; transition:border-color 0.2s,color 0.2s; }
    .btn-ghost:hover { border-color:var(--green); color:var(--green); }
    footer { border-top:1px solid var(--green-dark); padding:1.5rem 3rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--grey); }
    footer a { color:var(--grey); text-decoration:none; transition:color 0.2s; }
    footer a:hover { color:var(--green); }
    .pdf-wrapper { border:1px solid var(--green-dark); background:rgba(0,255,65,0.02); overflow:hidden; }
    .pdf-fallback { display:none; }
    @media (max-width:640px) {
      nav { padding:1rem 1.25rem; }
      .nav-links { gap:1.2rem; }
      .nav-cta { display:none; }
      footer { padding:1.25rem; }
      section { padding-left:1.25rem !important; padding-right:1.25rem !important; }
      .pdf-embed { display:none; }
      .pdf-fallback { display:block; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <nav>
    <a href="index.html" class="nav-logo">[CGS.EXE]</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
      <a href="resume.html" class="active">Résumé</a>
      <a href="contact.html" class="nav-cta">Send Signal</a>
    </div>
  </nav>

  <main>

    <section style="padding:4rem 3rem 2.5rem;" class="fade-in">
      <div class="section-label">// accessing_file: resume.pdf</div>
      <h1 style="font-size:clamp(2.4rem,6vw,4.5rem); margin-bottom:0.75rem;">Résumé</h1>
      <p style="font-size:0.75rem; color:var(--grey-light); max-width:480px; line-height:1.9; margin-bottom:2rem;">
        Full document. Download or view inline. Last updated 2026.
      </p>
      <div style="display:flex; gap:1rem; flex-wrap:wrap;">
        <a href="assets/resume.pdf" download class="btn">↓ Download PDF</a>
        <a href="assets/resume.pdf" target="_blank" class="btn-ghost">Open in new tab ↗</a>
      </div>
    </section>

    <hr class="rule" style="margin:0 3rem;" />

    <section style="padding:2.5rem 3rem 4rem;" class="fade-in">
      <div class="pdf-wrapper pdf-embed" style="height:85vh;">
        <iframe src="assets/resume.pdf" width="100%" height="100%" style="border:none; display:block;" title="Guroosh Singh Resume"></iframe>
      </div>
      <div class="pdf-fallback pdf-wrapper" style="padding:3rem; text-align:center;">
        <p style="font-size:0.75rem; color:var(--grey-light); margin-bottom:1.5rem;">&gt; PDF viewer unavailable on this display.</p>
        <a href="assets/resume.pdf" download class="btn">↓ Download Résumé</a>
      </div>
    </section>

  </main>

  <footer>
    <span>© 2026 Chaudhary Guroosh Singh</span>
    <div style="display:flex; gap:2rem;">
      <a href="https://github.com/guroosh" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/guroosh" target="_blank">LinkedIn</a>
      <a href="https://medium.com/@guroosh" target="_blank">Medium</a>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, drops;
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
    const fontSize = 14;
    function init() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; drops = Array(Math.floor(W/fontSize)).fill(1); }
    function draw() {
      ctx.fillStyle='rgba(8,12,8,0.05)'; ctx.fillRect(0,0,W,H);
      ctx.font=fontSize+'px Share Tech Mono,monospace';
      drops.forEach((y,i)=>{
        const char=chars[Math.floor(Math.random()*chars.length)];
        ctx.fillStyle=Math.random()>0.95?'#00ff41':'#00cc33';
        ctx.fillText(char,i*fontSize,y*fontSize);
        if(y*fontSize>H&&Math.random()>0.975)drops[i]=0;
        drops[i]++;
      });
    }
    init(); window.addEventListener('resize',init); setInterval(draw,45);
  </script>
</body>
</html>
